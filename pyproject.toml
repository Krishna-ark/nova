[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-core"
version = "0.1.0"
description = "NOVA — a permission-controlled AI agent operating layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "NOVA" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
nova = "nova.main:run"

[tool.hatch.build.targets.wheel]
packages = ["core/nova"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "RUF",
    "ASYNC",
    "S",
    "T20",
]

ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"core/tests/**/*.py" = ["S101", "S105", "S106"]
"core/nova/storage/migrations/**/*.py" = ["ANN", "N999", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["core/nova", "core/tests"]
plugins = ["pydantic.mypy"]

strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "nova.storage.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["core/tests"]
pythonpath = ["core"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that exercise more than one component together",
]
