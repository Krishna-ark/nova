# Alembic configuration for NOVA.
#
# The database URL is deliberately absent here. env.py resolves it from the
# application settings (or from a URL injected by tests), so a real database
# path is never committed to source control.

[alembic]
script_location = core/nova/storage/migrations

# Makes `nova` importable when alembic runs from the repository root.
prepend_sys_path = core

# Deterministic, sortable filenames: 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S